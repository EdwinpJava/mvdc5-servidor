{% extends "base.html" %}

{% block content %}
<section class="section-padding" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa;">
    <div class="container" style="max-width: 450px;">
        <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center;">
            <div style="width: 80px; height: 80px; background: #e62117; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px; font-size: 2rem;">
                <i class="fas fa-lock"></i>
            </div>
            
            <h2 style="color: #1a2a3a; font-weight: 800; margin-bottom: 15px;">Acceso Restringido</h2>
            <p style="color: #666; margin-bottom: 30px;">Esta sección es exclusiva para el personal autorizado. Por favor, ingrese la contraseña de acceso.</p>
            
            <form action="{{ url_for('equipo_editorial') }}" method="POST">
                <div class="input-group" style="margin-bottom: 20px; text-align: left;">
                    <label style="font-weight: 700; color: #555; margin-bottom: 10px; display: block;">Contraseña de Seguridad:</label>
                    <div style="position: relative;">
                        <input type="password" name="password" required 
                               style="width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 10px; outline: none; transition: 0.3s; font-size: 1rem;"
                               placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" class="btn-submit" style="background: #e62117; padding: 15px; width: 100%; border-radius: 10px; font-weight: 800; letter-spacing: 1px;">
                    <i class="fas fa-sign-in-alt"></i> ENTRAR AL EQUIPO
                </button>
            </form>
            
            <div style="margin-top: 25px;">
                <a href="{{ url_for('inicio') }}" style="color: #666; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                    <i class="fas fa-arrow-left"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</section>

<style>
    input:focus {
        border-color: #e62117 !important;
        box-shadow: 0 0 0 4px rgba(230, 33, 23, 0.1);
    }
</style>
{% endblock %}
